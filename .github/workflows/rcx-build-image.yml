# Construieste imaginea RCX din acest branch si o impinge in GHCR.
#
# De ce exista: imaginea era construita de mana, pe un Mac, deci iesea arm64. Dropletul de
# productie e amd64, iar containerul murea instant cu „exec format error" — o eroare care nu
# spune nimic despre arhitectura. De aici incolo, imaginea vine dintr-un runner amd64.
#
# Manual, cu tag dat de om: imaginea se schimba rar (upgrade de Chatwoot sau un patch nou),
# iar tagul spune ce contine — versiunea upstream plus a cata noastra revizie.
name: Build RCX image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tagul imaginii, ex. 4.16.1-rcx.3'
        required: true
        default: '4.16.1-rcx.3'

jobs:
  build:
    # Se construieste doar din branch-urile noastre: `main` e oglinda upstream, nu are patch-urile.
    if: startsWith(github.ref_name, 'rcx/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Arhitectura dropletului. Nu multi-arch: n-avem unde rula arm64, iar emularea ar
          # transforma un build de 30 de minute in unul de cateva ore.
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chatwoot:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Spune ce sa pui in secretul CHATWOOT_IMAGE
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/chatwoot:${{ inputs.tag }}
        run: |
          {
            echo "### Imagine publicata"
            echo '```'
            echo "CHATWOOT_IMAGE=$IMAGE"
            echo '```'
            echo "Se pune ca secret \`CHATWOOT_IMAGE\` in repo-ul centrala-mesaje."
          } >> "$GITHUB_STEP_SUMMARY"
